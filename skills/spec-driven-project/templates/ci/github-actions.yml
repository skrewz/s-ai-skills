# CI for a spec-driven, Makefile-driven project.
#
# The pipeline deliberately stays thin: it installs the toolchain and calls the
# Makefile targets, so the Makefile remains the single source of build/test
# logic. Add the `e2e` job only when an e2e mechanism is called for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install your toolchain here (e.g. actions/setup-go, actions/setup-node,
      # actions/setup-python), then run the Makefile targets:
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Lint
        run: make lint

  # --- end-to-end (only when an e2e mechanism is called for) ---------------
